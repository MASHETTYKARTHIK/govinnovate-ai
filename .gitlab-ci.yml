stages:
  - lint
  - test

include:
  - template: Security/SAST.gitlab-ci.yml

lint:
  stage: lint
  image: python:3.11
  script:
    - pip install -r requirements-dev.txt
    - black --check .
    - ruff check .

test:
  stage: test
  image: python:3.11
  script:
    - pip install pytest streamlit pandas plotly
    - pytest