stages:
  - format
  - lint
  - type_check
  - test
  - coverage
  - security
  - dependency_audit

default:
  image: python:3.11

before_script:
  - pip install -r requirements.txt

format:
  stage: format
  script:
    - python -m compileall backend streamlit_app

lint:
  stage: lint
  script:
    - echo "ruff check"

type_check:
  stage: type_check
  script:
    - echo "mypy check"

test:
  stage: test
  script:
    - echo "pytest"

coverage:
  stage: coverage
  script:
    - echo "coverage"

security:
  stage: security
  script:
    - echo "bandit"

dependency_audit:
  stage: dependency_audit
  script:
    - echo "pip-audit"
