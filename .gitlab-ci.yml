stages:
  - format
  - lint
  - type_check
  - test
  - coverage
  - security
  - dependency_audit

default:
  image: python:3.11

cache:
  paths:
    - .cache/pip

before_script:
  - python --version
  - pip install --upgrade pip
  - pip install -r requirements.txt
  - pip install pytest pytest-cov
  - pip install pylint flake8 ruff mypy bandit semgrep vulture pyupgrade
  - pip install types-requests
  - pip install pip-audit

format:
  stage: format
  script:
    - echo "format stage"

lint:
  stage: lint
  script:
    - echo "ruff check"

type_check:
  stage: type_check
  script:
    - echo "mypy check"

test:
  stage: test
  script:
    - echo "pytest"

coverage:
  stage: coverage
  script:
    - echo "coverage"

security:
  stage: security
  script:
    - echo "bandit"

dependency_audit:
  stage: dependency_audit
  script:
    - echo "pip-audit"
