stages:

  - lint
  - format
  - type_check
  - test
  - coverage
  - quality
  - security

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

.default:
  image: python:3.11
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements-dev.txt

format:
  stage: format
  script:
    - black --check .

lint:
  stage: lint
  script:
    - apt-get update -y && apt-get install -y curl tar
    - curl -sSL https://github.com/zricethezav/gitleaks/releases/latest/download/gitleaks-linux-amd64.tar.gz | tar xz -C /tmp
    - chmod +x /tmp/gitleaks
    - mv /tmp/gitleaks /usr/local/bin/gitleaks
    - pre-commit install
    - pre-commit run --all-files
    - ruff check .
    - python -m ruff check .
    - flake8 .
    - python -m flake8 .
    - pylint backend streamlit_app
    - python -m pylint backend streamlit_app
    - pyupgrade --py311-plus backend/**/*.py streamlit_app/**/*.py
    - python -m pyupgrade --py311-plus backend/**/*.py streamlit_app/**/*.py

type_check:
  stage: type_check
  script:
    - mypy .
    - python -m mypy .

test:
  stage: test
  script:
    - pytest -q


coverage:
  stage: coverage
  script:
    - pytest --cov=. --cov-report=xml --cov-report=term
    - pytest --cov=. --cov-report=xml --cov-fail-under=80
  artifacts:
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml


quality_check:
  stage: quality
  script:
    - vulture backend streamlit_app
    - python -m vulture backend streamlit_app

dependency_audit:
  stage: security
  script:
    - pip-audit
    - pip-audit -r requirements-dev.txt


secret_scan:
  stage: security
  script:
    - apt-get update -y && apt-get install -y curl tar
    - curl -sSL https://github.com/zricethezav/gitleaks/releases/latest/download/gitleaks-linux-amd64.tar.gz | tar xz -C /tmp
    - chmod +x /tmp/gitleaks
    - /tmp/gitleaks detect --source . --report-path gitleaks-report.json
  artifacts:
    paths:
      - gitleaks-report.json





generate_changelog:
  stage: security
  script:
    - git-cliff --config cliff.toml --output CHANGELOG.md
  artifacts:
    paths:
      - CHANGELOG.md
