```yaml
stages:
  - lint
  - format
  - type_check
  - test
  - coverage
  - quality
  - security

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

default:
  image: python:3.11

  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements-dev.txt

format:
  stage: format
  script:
    - black --check .

lint:
  stage: lint
  script:
    - pre-commit install
    - pre-commit run --all-files
    - ruff check .
    - flake8 .
    - pylint backend streamlit_app || true

type_check:
  stage: type_check
  script:
    - mypy .

test:
  stage: test
  script:
    - pytest -q

coverage:
  stage: coverage
  script:
    - pytest --cov=. --cov-report=xml --cov-report=term --cov-fail-under=80

  artifacts:
    paths:
      - coverage.xml

quality_check:
  stage: quality
  script:
    - vulture backend streamlit_app

dependency_audit:
  stage: security
  script:
    - pip-audit -r requirements-dev.txt

secret_scan:
  stage: security
  script:
    - pip install detect-secrets
    - detect-secrets scan > .secrets.baseline

generate_changelog:
  stage: security
  script:
    - pip install git-cliff
    - git-cliff --output CHANGELOG.md

  artifacts:
    paths:
      - CHANGELOG.md
```
