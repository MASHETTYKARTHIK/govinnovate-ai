[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=xml --cov-report=term --cov-fail-under=80"

[tool.pylint.main]
py-version = "3.11"

[tool.vulture]
min_confidence = 60
